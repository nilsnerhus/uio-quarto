name: Render template PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render starter and regression documents
        run: |
          quarto render template.qmd --to uio-paper-typst
          quarto render tests/coverless.qmd --to uio-paper-typst
          quarto render tests/long-title.qmd --to uio-paper-typst
          test -s template.pdf
          test -s tests/coverless.pdf
          test -s tests/long-title.pdf
