title: UiO Paper
author: nilsnerhus
version: "0.1.0"
quarto-required: ">=1.9.0"
contributes:
  formats:
    typst:
      mainfont: "Libertinus Serif"
      fontsize: 11pt
      papersize: a4
      toc: false
      margin:
        x: 25mm
        y: 24mm
      cover: true
      format-resources:
        - assets/uio-fp-navn-bm.png
        - assets/uio-fp-navn-nn.png
        - assets/uio-fp-navn-eng.pdf
        - assets/uio-fp-segl.pdf
      template-partials:
        - typst-template.typ
        - typst-show.typ
